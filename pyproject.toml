# Recnet model-input + network-builder candidate stack; campaign tools excluded.
# 分发名与版本为占位：上游尚无分发元数据，PR 讨论时可再定。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recnet"
version = "0.0.1"
readme = "README.md"
description = "Recnet reaction-network workflow with explicit model and head inputs"
requires-python = ">=3.10"
dependencies = ["ase", "numpy", "scipy", "PyYAML", "sella", "deepmd-kit[torch]>=3.2.0b1.dev67"]

[project.optional-dependencies]
core = [] # compatibility alias: runtime dependencies are installed by default
builder = ["rdkit"]
pipeline = [] # compatibility alias
surface = ["pymatgen"]
dev = ["pytest>=7", "ruff>=0.9"]

[tool.setuptools]
include-package-data = false
py-modules = ["run_dp_ts", "slabsite"]

[tool.setuptools.packages.find]
where = ["."]
include = ["handlers", "ccqn", "ccqn.*", "utils", "recnet_backend", "recnet_adapter", "recnet_adapter.tools", "recnet_adapter.tools.*", "network_builder"]

[tool.setuptools.package-data]
recnet_adapter = ["model_config.json", "tools/finalize_network.sh"]

[tool.pytest.ini_options]
testpaths = ["recnet_backend/tests", "recnet_adapter/tests", "network_builder/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
